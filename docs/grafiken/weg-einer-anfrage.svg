<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 955" width="1000" height="955" font-family="Source Sans 3, Source Sans Pro, Noto Sans, Liberation Sans, Arial, DejaVu Sans, sans-serif" role="img" aria-label="Ablauf einer Anfrage im Repair Café vom Eingang bis zur Meldung"><title>Weg einer Anfrage im Repair Café</title><rect width="1000" height="955" fill="#ffffff"/><rect x="20" y="14" width="22" height="16" rx="4" fill="#ffffff" stroke="#5f5e5a" stroke-width="2" stroke-dasharray="5 4"/><text x="50" y="27" font-size="14" fill="#1b1b1a">Gast</text><rect x="110" y="14" width="22" height="16" rx="4" fill="#e4f2e4" stroke="#008300" stroke-width="2"/><text x="140" y="27" font-size="14" fill="#1b1b1a">Mensch entscheidet</text><rect x="300" y="14" width="22" height="16" rx="4" fill="#e3eefb" stroke="#2a78d6" stroke-width="2"/><text x="330" y="27" font-size="14" fill="#1b1b1a">MANUEL schlägt vor</text><rect x="490" y="14" width="22" height="16" rx="4" fill="#efefec" stroke="#8a8984" stroke-width="2"/><text x="520" y="27" font-size="14" fill="#1b1b1a">feste Regel in Zammad oder n8n</text><rect x="20" y="60" width="225" height="50" rx="10" fill="#ffffff" stroke="#5f5e5a" stroke-width="2" stroke-dasharray="5 4"/><text x="132.5" y="91.0" text-anchor="middle" font-size="17" font-weight="600" fill="#1b1b1a">E-Mail</text><rect x="265" y="60" width="225" height="50" rx="10" fill="#ffffff" stroke="#5f5e5a" stroke-width="2" stroke-dasharray="5 4"/><text x="377.5" y="91.0" text-anchor="middle" font-size="17" font-weight="600" fill="#1b1b1a">Kontaktformular</text><rect x="510" y="60" width="225" height="50" rx="10" fill="#ffffff" stroke="#5f5e5a" stroke-width="2" stroke-dasharray="5 4"/><text x="622.5" y="91.0" text-anchor="middle" font-size="17" font-weight="600" fill="#1b1b1a">Anrufbeantworter</text><rect x="755" y="60" width="225" height="50" rx="10" fill="#ffffff" stroke="#5f5e5a" stroke-width="2" stroke-dasharray="5 4"/><text x="867.5" y="91.0" text-anchor="middle" font-size="17" font-weight="600" fill="#1b1b1a">Spontan am Empfang</text><path d="M 132 110 L 132 130 L 500 130 L 500 150" fill="none" stroke="#5f5e5a" stroke-width="2"/><path d="M 500 150 L 495.0 140.0 L 505.0 140.0 Z" fill="#5f5e5a"/><path d="M 377 110 L 377 130 L 500 130 L 500 150" fill="none" stroke="#5f5e5a" stroke-width="2"/><path d="M 500 150 L 495.0 140.0 L 505.0 140.0 Z" fill="#5f5e5a"/><path d="M 622 110 L 622 130 L 500 130 L 500 150" fill="none" stroke="#5f5e5a" stroke-width="2"/><path d="M 500 150 L 495.0 140.0 L 505.0 140.0 Z" fill="#5f5e5a"/><path d="M 867 110 L 867 130 L 500 130 L 500 150" fill="none" stroke="#5f5e5a" stroke-width="2"/><path d="M 500 150 L 495.0 140.0 L 505.0 140.0 Z" fill="#5f5e5a"/><rect x="250" y="152" width="500" height="72" rx="10" fill="#efefec" stroke="#8a8984" stroke-width="2"/><text x="500.0" y="178" text-anchor="middle" font-size="17" font-weight="600" fill="#1b1b1a">Ticket in Zammad</text><text x="500.0" y="199" text-anchor="middle" font-size="13.5" fill="#4a4945">ein Ticket je Gerät, Tag mit dem Datum des Termins</text><text x="500.0" y="217" text-anchor="middle" font-size="13.5" fill="#4a4945">spontan legt der Empfang das Ticket an</text><text x="742" y="217" text-anchor="end" font-size="11" fill="#4a4945">ADR 34</text><path d="M 500 224 L 500 252" fill="none" stroke="#5f5e5a" stroke-width="2"/><path d="M 500 252 L 495.0 242.0 L 505.0 242.0 Z" fill="#5f5e5a"/><rect x="250" y="254" width="500" height="72" rx="10" fill="#e3eefb" stroke="#2a78d6" stroke-width="2"/><text x="500.0" y="280" text-anchor="middle" font-size="17" font-weight="600" fill="#1b1b1a">Einordnen und Felder vorschlagen</text><text x="500.0" y="301" text-anchor="middle" font-size="13.5" fill="#4a4945">Kategorie, Marke, Bezeichnung, Defekt</text><text x="500.0" y="319" text-anchor="middle" font-size="13.5" fill="#4a4945">auch vom Foto des Typenschilds</text><text x="742" y="319" text-anchor="end" font-size="11" fill="#4a4945">ADR 34, 40</text><rect x="20" y="254" width="190" height="90" rx="10" fill="#e4f2e4" stroke="#008300" stroke-width="2"/><text x="115.0" y="280" text-anchor="middle" font-size="17" font-weight="600" fill="#1b1b1a">Aufteilen</text><text x="115.0" y="301" text-anchor="middle" font-size="13.5" fill="#4a4945">mehrere Geräte genannt</text><text x="115.0" y="319" text-anchor="middle" font-size="13.5" fill="#4a4945">MANUEL erkennt sie</text><text x="202" y="337" text-anchor="end" font-size="11" fill="#4a4945">ADR 6, 34</text><path d="M 250 290 L 212 290" fill="none" stroke="#5f5e5a" stroke-width="2"/><path d="M 212 290 L 222.0 285.0 L 222.0 295.0 Z" fill="#5f5e5a"/><path d="M 115 254 L 115 188 L 248 188" fill="none" stroke="#5f5e5a" stroke-width="2" stroke-dasharray="6 5"/><path d="M 248 188 L 238.0 193.0 L 238.0 183.0 Z" fill="#5f5e5a"/><text x="124" y="210" text-anchor="start" font-size="13" font-style="italic" fill="#4a4945">je Gerät ein Ticket</text><rect x="790" y="254" width="190" height="90" rx="10" fill="#e4f2e4" stroke="#008300" stroke-width="2"/><text x="885.0" y="280" text-anchor="middle" font-size="17" font-weight="600" fill="#1b1b1a">Rückfrage</text><text x="885.0" y="301" text-anchor="middle" font-size="13.5" fill="#4a4945">wenn Angaben fehlen</text><text x="885.0" y="319" text-anchor="middle" font-size="13.5" fill="#4a4945">Text von MANUEL</text><text x="972" y="337" text-anchor="end" font-size="11" fill="#4a4945">ADR 11</text><path d="M 750 290 L 788 290" fill="none" stroke="#5f5e5a" stroke-width="2"/><path d="M 788 290 L 778.0 295.0 L 778.0 285.0 Z" fill="#5f5e5a"/><path d="M 885 254 L 885 188 L 752 188" fill="none" stroke="#5f5e5a" stroke-width="2" stroke-dasharray="6 5"/><path d="M 752 188 L 762.0 183.0 L 762.0 193.0 Z" fill="#5f5e5a"/><text x="876" y="210" text-anchor="end" font-size="13" font-style="italic" fill="#4a4945">Antwort des Gastes</text><path d="M 500 326 L 500 354" fill="none" stroke="#5f5e5a" stroke-width="2"/><path d="M 500 354 L 495.0 344.0 L 505.0 344.0 Z" fill="#5f5e5a"/><rect x="250" y="356" width="500" height="72" rx="10" fill="#e3eefb" stroke="#2a78d6" stroke-width="2"/><text x="500.0" y="382" text-anchor="middle" font-size="17" font-weight="600" fill="#1b1b1a">Lösungsansatz</text><text x="500.0" y="403" text-anchor="middle" font-size="13.5" fill="#4a4945">interne Notiz mit Schritten, Werkzeug und Sicherheit</text><text x="500.0" y="421" text-anchor="middle" font-size="13.5" fill="#4a4945">passende Artikel und Links zu Anleitungen</text><text x="742" y="421" text-anchor="end" font-size="11" fill="#4a4945">ADR 22, 35</text><path d="M 500 428 L 500 456" fill="none" stroke="#5f5e5a" stroke-width="2"/><path d="M 500 456 L 495.0 446.0 L 505.0 446.0 Z" fill="#5f5e5a"/><rect x="250" y="458" width="500" height="72" rx="10" fill="#efefec" stroke="#8a8984" stroke-width="2"/><text x="500.0" y="484" text-anchor="middle" font-size="17" font-weight="600" fill="#1b1b1a">Termin vorschlagen</text><text x="500.0" y="505" text-anchor="middle" font-size="13.5" fill="#4a4945">Kapazität aus den Anmeldungen der Helfenden</text><text x="500.0" y="523" text-anchor="middle" font-size="13.5" fill="#4a4945">ein Mensch bestätigt den Vorschlag</text><text x="742" y="523" text-anchor="end" font-size="11" fill="#4a4945">ADR 26</text><path d="M 500 530 L 500 558" fill="none" stroke="#5f5e5a" stroke-width="2"/><path d="M 500 558 L 495.0 548.0 L 505.0 548.0 Z" fill="#5f5e5a"/><path d="M 250 392 L 200 392 L 200 594 L 248 594" fill="none" stroke="#5f5e5a" stroke-width="2" stroke-dasharray="6 5"/><path d="M 248 594 L 238.0 599.0 L 238.0 589.0 Z" fill="#5f5e5a"/><text x="192" y="500" text-anchor="end" font-size="13" font-style="italic" fill="#4a4945">spontan</text><rect x="250" y="560" width="500" height="72" rx="10" fill="#e4f2e4" stroke="#008300" stroke-width="2"/><text x="500.0" y="586" text-anchor="middle" font-size="17" font-weight="600" fill="#1b1b1a">Reparatur am Termin</text><text x="500.0" y="607" text-anchor="middle" font-size="13.5" fill="#4a4945">Gast und Engagierte reparieren gemeinsam</text><text x="500.0" y="625" text-anchor="middle" font-size="13.5" fill="#4a4945">Felder im Ticket prüfen und korrigieren</text><text x="742" y="625" text-anchor="end" font-size="11" fill="#4a4945">ADR 17</text><path d="M 500 632 L 500 660" fill="none" stroke="#5f5e5a" stroke-width="2"/><path d="M 500 660 L 495.0 650.0 L 505.0 650.0 Z" fill="#5f5e5a"/><rect x="250" y="662" width="500" height="72" rx="10" fill="#e4f2e4" stroke="#008300" stroke-width="2"/><text x="500.0" y="688" text-anchor="middle" font-size="17" font-weight="600" fill="#1b1b1a">Ergebnis eintragen</text><text x="500.0" y="709" text-anchor="middle" font-size="13.5" fill="#4a4945">gelungen, teilweise gelungen, vertagt,</text><text x="500.0" y="727" text-anchor="middle" font-size="13.5" fill="#4a4945">nicht erfolgt, abgebrochen, nicht erschienen</text><path d="M 750 698 L 800 698 L 800 494 L 752 494" fill="none" stroke="#5f5e5a" stroke-width="2" stroke-dasharray="6 5"/><path d="M 752 494 L 762.0 489.0 L 762.0 499.0 Z" fill="#5f5e5a"/><text x="808" y="600" text-anchor="start" font-size="13" font-style="italic" fill="#4a4945">vertagt</text><path d="M 500 734 L 500 760 L 150 760 L 150 786" fill="none" stroke="#5f5e5a" stroke-width="2"/><path d="M 150 786 L 145.0 776.0 L 155.0 776.0 Z" fill="#5f5e5a"/><path d="M 500 734 L 500 786" fill="none" stroke="#5f5e5a" stroke-width="2"/><path d="M 500 786 L 495.0 776.0 L 505.0 776.0 Z" fill="#5f5e5a"/><path d="M 500 760 L 850 760 L 850 786" fill="none" stroke="#5f5e5a" stroke-width="2"/><path d="M 850 786 L 845.0 776.0 L 855.0 776.0 Z" fill="#5f5e5a"/><rect x="20" y="788" width="290" height="90" rx="10" fill="#efefec" stroke="#8a8984" stroke-width="2"/><text x="165.0" y="814" text-anchor="middle" font-size="17" font-weight="600" fill="#1b1b1a">Statistik und Sharecard</text><text x="165.0" y="835" text-anchor="middle" font-size="13.5" fill="#4a4945">n8n zählt die Ergebnisse</text><text x="165.0" y="853" text-anchor="middle" font-size="13.5" fill="#4a4945">ein Mensch gibt die Karte frei</text><text x="302" y="871" text-anchor="end" font-size="11" fill="#4a4945">ADR 32, 33</text><rect x="355" y="788" width="290" height="90" rx="10" fill="#efefec" stroke="#8a8984" stroke-width="2"/><text x="500.0" y="814" text-anchor="middle" font-size="17" font-weight="600" fill="#1b1b1a">Meldung an Restarters</text><text x="500.0" y="835" text-anchor="middle" font-size="13.5" fill="#4a4945">jedes Gerät per API,</text><text x="500.0" y="853" text-anchor="middle" font-size="13.5" fill="#4a4945">weiter an die Open Repair Alliance</text><text x="637" y="871" text-anchor="end" font-size="11" fill="#4a4945">ADR 14, 36</text><rect x="690" y="788" width="290" height="90" rx="10" fill="#e3eefb" stroke="#2a78d6" stroke-width="2"/><text x="835.0" y="814" text-anchor="middle" font-size="17" font-weight="600" fill="#1b1b1a">Anleitung</text><text x="835.0" y="835" text-anchor="middle" font-size="13.5" fill="#4a4945">Entwurf aus erfolgreicher Reparatur</text><text x="835.0" y="853" text-anchor="middle" font-size="13.5" fill="#4a4945">für die Wissensdatenbank</text><text x="972" y="871" text-anchor="end" font-size="11" fill="#4a4945">ADR 22</text><text x="20" y="915" font-size="13.5" fill="#4a4945">Gestrichelt sind Schleifen und Abkürzungen. Ein Mensch prüft jeden Vorschlag von MANUEL, MANUEL schreibt nie selbst an Gäste.</text><text x="20" y="937" font-size="13.5" fill="#4a4945">Zum Start am 05.12.2026 ordnet der Ticket Categorizer von Zammad ein. n8n, Sharecard, Anleitungen und Suche folgen nach dem Zeitplan im PLAN.</text></svg>