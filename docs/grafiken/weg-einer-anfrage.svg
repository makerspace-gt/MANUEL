roke-width="2" stroke-dasharray="5 4"/><text x="115.0" y="494" text-anchor="middle" font-size="17" font-weight="600" fill="#1b1b1a">Erinnerung</text><text x="115.0" y="515" text-anchor="middle" font-size="13.5" fill="#4a4945">Mail der anstiftung</text><text x="115.0" y="533" text-anchor="middle" font-size="13.5" fill="#4a4945">zum nächsten Termin</text><path d="M 115 540 L 115 568" fill="none" stroke="#5f5e5a" stroke-width="2"/><path d="M 115 568 L 110.0 558.0 L 120.0 558.0 Z" fill="#5f5e5a"/><rect x="20" y="570" width="190" height="86" rx="10" fill="#efefec" stroke="#8a8984" stroke-width="2"/><text x="115.0" y="596" text-anchor="middle" font-size="17" font-weight="600" fill="#1b1b1a">Presse und Medien</text><text x="115.0" y="617" text-anchor="middle" font-size="13.5" fill="#4a4945">Pressemitteilung, Notiz</text><text x="115.0" y="635" text-anchor="middle" font-size="13.5" fill="#4a4945">für soziale Medien</text><text x="202" y="649" text-anchor="end" font-size="11" fill="#4a4945">ADR 66</text><path d="M 115 656 L 115 684" fill="none" stroke="#5f5e5a" stroke-width="2"/><path d="M 115 684 L 110.0 674.0 L 120.0 674.0 Z" fill="#5f5e5a"/><rect x="20" y="686" width="190" height="86" rx="10" fill="#efefec" stroke="#8a8984" stroke-width="2"/><text x="115.0" y="712" text-anchor="middle" font-size="17" font-weight="600" fill="#1b1b1a">Statistik-Ticket</text><text x="115.0" y="733" text-anchor="middle" font-size="13.5" fill="#4a4945">in Repairs::Events</text><text x="115.0" y="751" text-anchor="middle" font-size="13.5" fill="#4a4945">Spenden und Bedarf</text><text x="202" y="765" text-anchor="end" font-size="11" fill="#4a4945">ADR 60</text><path d="M 115 772 L 115 976" fill="none" stroke="#5f5e5a" stroke-width="2"/><path d="M 115 976 L 110.0 966.0 L 120.0 966.0 Z" fill="#5f5e5a"/><path d="M 500 962 L 200 962 L 200 976" fill="none" stroke="#5f5e5a" stroke-width="2"/><path d="M 200 976 L 195.0 966.0 L 205.0 966.0 Z" fill="#5f5e5a"/><path d="M 500 948 L 500 976" fill="none" stroke="#5f5e5a" stroke-width="2"/><path d="M 500 976 L 495.0 966.0 L 505.0 966.0 Z" fill="#5f5e5a"/><path d="M 500 962 L 835 962 L 835 976" fill="none" stroke="#5f5e5a" stroke-width="2"/><path d="M 835 976 L 830.0 966.0 L 840.0 966.0 Z" fill="#5f5e5a"/><rect x="20" y="978" width="290" height="90" rx="10" fill="#efefec" stroke="#8a8984" stroke-width="2"/><text x="165.0" y="1004" text-anchor="middle" font-size="17" font-weight="600" fill="#1b1b1a">Statistik und Sharecard</text><text x="165.0" y="1025" text-anchor="middle" font-size="13.5" fill="#4a4945">n8n zählt die Ergebnisse, ein Mensch</text><text x="165.0" y="1043" text-anchor="middle" font-size="13.5" fill="#4a4945">gibt Karte und Beiträge frei</text><text x="302" y="1061" text-anchor="end" font-size="11" fill="#4a4945">ADR 32, 33, 66</text><rect x="355" y="978" width="290" height="90" rx="10" fill="#efefec" stroke="#8a8984" stroke-width="2"/><text x="500.0" y="1004" text-anchor="middle" font-size="17" font-weight="600" fill="#1b1b1a">Meldung an Restarters</text><text x="500.0" y="1025" text-anchor="middle" font-size="13.5" fill="#4a4945">jedes Gerät per API,</text><text x="500.0" y="1043" text-anchor="middle" font-size="13.5" fill="#4a4945">weiter an die Open Repair Alliance</text><text x="637" y="1061" text-anchor="end" font-size="11" fill="#4a4945">ADR 14, 36</text><rect x="690" y="978" width="290" height="90" rx="10" fill="#e3eefb" stroke="#2a78d6" stroke-width="2"/><text x="835.0" y="1004" text-anchor="middle" font-size="17" font-weight="600" fill="#1b1b1a">Anleitung</text><text x="835.0" y="1025" text-anchor="middle" font-size="13.5" fill="#4a4945">Entwurf aus erfolgreicher Reparatur</text><text x="835.0" y="1043" text-anchor="middle" font-size="13.5" fill="#4a4945">für die Wissensdatenbank</text><text x="972" y="1061" text-anchor="end" font-size="11" fill="#4a4945">ADR 22</text><text x="20" y="1100" font-size="13.5" fill="#4a4945">Gestrichelt sind Schleifen und Abkürzungen. Ein Mensch prüft jeden Vorschlag von MANUEL, MANUEL schreibt nie selbst an Gäste.</text><text x="20" y="1122" font-size="13.5" fill="#4a4945">Mails an Gäste sind feste Texte in Zammad. n8n, Sharecard, Anleitungen und Suche folgen nach dem Zeitplan im PLAN.</text></svg>