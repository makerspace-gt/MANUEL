angsbestätigung mit Hausordnung</text><text x="500.0" y="227" text-anchor="middle" font-size="13.5" fill="#4a4945">contact-check bei abweichenden Kontaktdaten</text><text x="742" y="227" text-anchor="end" font-size="11" fill="#4a4945">ADR 34, 60, 63</text><path d="M 500 234 L 500 262" fill="none" stroke="#5f5e5a" stroke-width="2"/><path d="M 500 262 L 495.0 252.0 L 505.0 252.0 Z" fill="#5f5e5a"/><rect x="250" y="264" width="500" height="72" rx="10" fill="#e3eefb" stroke="#2a78d6" stroke-width="2"/><text x="500.0" y="290" text-anchor="middle" font-size="17" font-weight="600" fill="#1b1b1a">Einordnen und Felder vorschlagen</text><text x="500.0" y="311" text-anchor="middle" font-size="13.5" fill="#4a4945">Kategorie, Marke, Bezeichnung, Defekt</text><text x="500.0" y="329" text-anchor="middle" font-size="13.5" fill="#4a4945">auch vom Foto des Typenschilds</text><text x="742" y="329" text-anchor="end" font-size="11" fill="#4a4945">ADR 34, 40</text><rect x="20" y="264" width="190" height="114" rx="10" fill="#e4f2e4" stroke="#008300" stroke-width="2"/><text x="115.0" y="290" text-anchor="middle" font-size="17" font-weight="600" fill="#1b1b1a">Aufteilen</text><text x="115.0" y="311" text-anchor="middle" font-size="13.5" fill="#4a4945">mehrere Geräte genannt</text><text x="115.0" y="329" text-anchor="middle" font-size="13.5" fill="#4a4945">Hinweis an den Gast</text><text x="115.0" y="347" text-anchor="middle" font-size="13.5" fill="#4a4945">weitere an späteren Tagen</text><text x="202" y="371" text-anchor="end" font-size="11" fill="#4a4945">ADR 34, 41</text><path d="M 250 300 L 212 300" fill="none" stroke="#5f5e5a" stroke-width="2"/><path d="M 212 300 L 222.0 295.0 L 222.0 305.0 Z" fill="#5f5e5a"/><path d="M 115 264 L 115 198 L 248 198" fill="none" stroke="#5f5e5a" stroke-width="2" stroke-dasharray="6 5"/><path d="M 248 198 L 238.0 203.0 L 238.0 193.0 Z" fill="#5f5e5a"/><text x="124" y="222" text-anchor="start" font-size="13" font-style="italic" fill="#4a4945">je Gerät ein Ticket</text><rect x="790" y="264" width="190" height="90" rx="10" fill="#e4f2e4" stroke="#008300" stroke-width="2"/><text x="885.0" y="290" text-anchor="middle" font-size="17" font-weight="600" fill="#1b1b1a">Nachfrage beim Gast</text><text x="885.0" y="311" text-anchor="middle" font-size="13.5" fill="#4a4945">wenn Angaben fehlen</text><text x="885.0" y="329" text-anchor="middle" font-size="13.5" fill="#4a4945">Text von MANUEL</text><text x="972" y="347" text-anchor="end" font-size="11" fill="#4a4945">ADR 17, 34</text><path d="M 750 290 L 788 290" fill="none" stroke="#5f5e5a" stroke-width="2"/><path d="M 788 290 L 778.0 295.0 L 778.0 285.0 Z" fill="#5f5e5a"/><path d="M 885 264 L 885 198 L 752 198" fill="none" stroke="#5f5e5a" stroke-width="2" stroke-dasharray="6 5"/><path d="M 752 198 L 762.0 193.0 L 762.0 203.0 Z" fill="#5f5e5a"/><text x="876" y="222" text-anchor="end" font-size="13" font-style="italic" fill="#4a4945">Antwort des Gastes</text><path d="M 500 336 L 500 364" fill="none" stroke="#5f5e5a" stroke-width="2"/><path d="M 500 364 L 495.0 354.0 L 505.0 354.0 Z" fill="#5f5e5a"/><rect x="250" y="366" width="500" height="72" rx="10" fill="#efefec" stroke="#8a8984" stroke-width="2"/><text x="500.0" y="392" text-anchor="middle" font-size="17" font-weight="600" fill="#1b1b1a">Termin vorschlagen</text><text x="500.0" y="413" text-anchor="middle" font-size="13.5" fill="#4a4945">Status Vorschlag, Nachfrage nach 2 Tagen, Absage nach 4</text><text x="500.0" y="431" text-anchor="middle" font-size="13.5" fill="#4a4945">kurz vor dem Termin nur Nachfrage</text><text x="742" y="431" text-anchor="end" font-size="11" fill="#4a4945">ADR 26, 60</text><path d="M 500 438 L 500 466" fill="none" stroke="#5f5e5a" stroke-width="2"/><path d="M 500 466 L 495.0 456.0 L 505.0 456.0 Z" fill="#5f5e5a"/><text x="508" y="457" text-anchor="start" font-size="13" font-style="italic" fill="#4a4945">bestätigt</text><rect x="250" y="468" width="500" height="72" rx="10" fill="#efefec" stroke="#8a8984" stroke-width="2"/><text x="500.0" y="494" text-anchor="middle" font-size="17" font-weight="600" fill="#1b1b1a">Terminiert</text><text x="500.0" y="515" text-anchor="middle" font-size="13.5" fill="#4a4945">Ticket wandert von Requests nach Repairs</text><text x="500.0" y="533" text-anchor="middle" font-size="13.5" fill="#4a4945">Erinnerung, wenn die Vereinbarung lange her ist</text><text x="742" y="533" text-anchor="end" font-size="11" fill="#4a4945">ADR 60</text><path d="M 500 540 L 500 568" fill="none" stroke="#5f5e5a" stroke-width="2"/><path d="M 500 568 L 495.0 558.0 L 505.0 558.0 Z" fill="#5f5e5a"/><rect x="250" y="570" width="500" height="72" rx="10" fill="#e3eefb" stroke="#2a78d6" stroke-width="2"/><text x="500.0" y="596" text-anchor="middle" font-size="17" font-weight="600" fill="#1b1b1a">Lösungsansatz bei next-event</text><text x="500.0" y="617" text-anchor="middle" font-size="13.5" fill="#4a4945">eine Woche vorher, interne Notiz mit Schritten, Werkzeug</text><text x="500.0" y="635" text-anchor="middle" font-size="13.5" fill="#4a4945">und Sicherheit, passende Artikel und Anleitungen</text><text x="742" y="635" text-anchor="end" font-size="11" fill="#4a4945">ADR 22, 35, 61</text><path d="M 500 642 L 500 670" fill="none" stroke="#5f5e5a" stroke-width="2"/><path d="M 500 670 L 495.0 660.0 L 505.0 660.0 Z" fill="#5f5e5a"/><path d="M 750 322 L 770 322 L 770 708 L 752 708" fill="none" stroke="#5f5e5a" stroke-width="2" stroke-dasharray="6 5"/><path d="M 752 708 L 762.0 703.0 L 762.0 713.0 Z" fill="#5f5e5a"/><text x="778" y="560" text-anchor="start" font-size="13" font-style="italic" fill="#4a4945">spontan</text><rect x="250" y="672" width="500" height="72" rx="10" fill="#e4f2e4" stroke="#008300" stroke-width="2"/><text x="500.0" y="698" text-anchor="middle" font-size="17" font-weight="600" fill="#1b1b1a">Reparatur am Termin</text><text x="500.0" y="719" text-anchor="middle" font-size="13.5" fill="#4a4945">Checkliste mit Hausordnung, Kontaktdaten, Newsletter,</tex