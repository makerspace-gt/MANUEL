# The containers publish their ports on the Tailscale address, see
# docs/adr/0047-dienste-zum-testen-im-tailnet-oeffnen.adoc. Podman binds these ports itself, so a
# container cannot start before the address exists. Wait for it, but at most 60 seconds. Containers
# that still fail then are started by hand once Tailscale is up, see docs/inbetriebnahme.md step 7.
[Unit]
Wants=tailscaled.service
After=tailscaled.service

[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 60); do tailscale ip -4 >/dev/null 2>&1 && exit 0; sleep 1; done; exit 0'
