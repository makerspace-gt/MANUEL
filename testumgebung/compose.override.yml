# Test environment on MANUEL, see docs/adr/0043-eine-testumgebung-auf-manuel-betreiben.adoc
# and docs/inbetriebnahme.md step 7. Used together with docker-compose.yml of zammad-docker-compose
# and zammad.env, all in the image under /usr/share/manuel, started with the command zammad-compose.
# The ports are published on all interfaces, so admins open them through Tailscale in the browser,
# without TLS and without a reverse proxy. They are reachable from the local network as well, because
# Podman bypasses the host firewall. Before real data from a backup goes in, restrict them again.

services:
  zammad-nginx:
    ports: !override
      - "8080:8080"

  # Not needed for the test environment, saves memory for the models.
  # Zammad itself is told by ELASTICSEARCH_ENABLED=false in zammad.env.
  zammad-elasticsearch:
    profiles:
      - do-not-start

  # Catches every mail of the test instance, nothing reaches real guests. Inside the network of the
  # stack Mailpit also answers as mail.lima-city.de, with SMTP over TLS on port 465 and any login,
  # so Zammad sends to Mailpit even with the real settings of lima-city. Fetching by IMAP from
  # mail.lima-city.de does not work then, use the IP address of lima-city for that.
  mailpit:
    image: docker.io/axllent/mailpit:v1.33.1
    restart: always
    environment:
      MP_SMTP_BIND_ADDR: 0.0.0.0:465
      MP_SMTP_REQUIRE_TLS: "true"
      MP_SMTP_TLS_CERT: sans:mail.lima-city.de,mailpit
      MP_SMTP_TLS_KEY: sans:mail.lima-city.de,mailpit
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
    networks:
      default:
        aliases:
          - mail.lima-city.de
    ports:
      - "8025:8025"

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.45.0
    restart: always
    environment:
      GENERIC_TIMEZONE: Europe/Berlin
      TZ: Europe/Berlin
      N8N_SECURE_COOKIE: "false"
    ports:
      - "5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n

volumes:
  n8n-data:
